name: 感想・改善案
description: ゲームの感想、施策や数値への指摘、追加してほしい機能など
title: "[改善] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: 種類
      options:
        - 感想
        - 施策・イベントの追加や修正
        - 単価・試算の指摘
        - 画面・操作性の改善
        - その他
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 内容
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: 根拠・参考資料
      description: 単価や Well-Architected の項目への指摘の場合は、公式ドキュメントの URL などがあると助かります
  - type: input
    id: result
    attributes:
      label: プレイ結果（任意）
      description: X ポストの結果ページ URL を貼ると状況が伝わります
